value = "Took command of the XIV Corps, renamed the Army of the Cumberland, on 1862-10-24; fought Stones River from 1862-12-31, ran the Tullahoma Campaign (1863-06-24 to 1863-07-03) with very low Union losses, and was relieved by Grant in October 1863."
