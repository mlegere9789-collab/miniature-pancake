[career.fact]
value = "An order sent about 10:50 a.m. on 1863-09-20 told Wood to close up on Reynolds while Brannan's division stood between them; Wood pulled out of line and opened the gap Longstreet struck. The order was written by aide Frank Bond and bypassed Crittenden."
