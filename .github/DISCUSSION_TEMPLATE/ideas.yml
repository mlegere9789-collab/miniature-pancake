title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Suggest a feature or a change. Describe the problem before the solution.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What can you not do, or do only awkwardly, today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Modeling
        - Drafting and layout
        - Rendering
        - File formats
        - Dino Flow
        - Plug-in API
        - Documentation
        - Other
    validations:
      required: true
