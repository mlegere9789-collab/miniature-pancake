name: MediaSuite CI

# WPF only builds on Windows, so this is the real compile check for the app —
# the whole solution, plus both the Core and App test suites.
on:
  push:
    branches: [main]
    paths:
      - 'mediasuite/**'
      - '.github/workflows/mediasuite-ci.yml'
  pull_request:
    paths:
      - 'mediasuite/**'
      - '.github/workflows/mediasuite-ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore mediasuite/MediaSuite.sln

      - name: Build
        run: dotnet build mediasuite/MediaSuite.sln -c Release --no-restore

      - name: Test
        # Two explicit invocations, not one `dotnet test` on the whole .sln: running the
        # solution as a single command only ever reported MediaSuite.Core.Tests' own
        # results (confirmed across this branch's entire CI history -- every prior run's
        # "Test" step log shows exactly one "Total tests: N" summary and zero references to
        # any MediaSuite.App.Tests class), silently never invoking MediaSuite.App.Tests at
        # all. Every App-layer regression test added this session was compiling cleanly
        # (the separate Build step covers both projects) but had never actually run under
        # CI. Each project gets its own command so neither can go silently missing again.
        # Both run regardless of the other's outcome (unlike the .sln-wide invocation's
        # default MSBuild fail-fast, which stops at the first failing project) so a failure
        # in one doesn't hide the other's full results -- but the step still has to fail
        # overall if either did, which needs an explicit exit code check since PowerShell
        # (this runner's default shell) does not stop a script on a failed command the way
        # bash's `set -e` would.
        run: |
          dotnet test mediasuite/tests/MediaSuite.Core.Tests/MediaSuite.Core.Tests.csproj -c Release --no-build --verbosity normal
          $coreTestsExitCode = $LASTEXITCODE

          dotnet test mediasuite/tests/MediaSuite.App.Tests/MediaSuite.App.Tests.csproj -c Release --no-build --verbosity normal
          $appTestsExitCode = $LASTEXITCODE

          if ($coreTestsExitCode -ne 0 -or $appTestsExitCode -ne 0) {
            exit 1
          }

  installer:
    name: Build installer
    runs-on: windows-latest
    needs: build
    outputs:
      version: ${{ steps.version.outputs.version }}
    # This job alone is what has been burning the free-tier Actions minutes: ~25-30
    # real minutes, and Windows runners bill at 2x, so ~50-60 minutes per run. Restricted
    # to real merges to main (same condition "Publish release" below already uses) so
    # ordinary PR development only ever pays for the fast "Build and test" job above —
    # the installer, which nothing but a release actually needs, no longer runs on every
    # push to a PR branch. workflow_dispatch is the deliberate escape hatch: a PR that
    # changes fetch-tools.ps1 or installer/native/ itself needs this job's real result
    # before merging, not just after, so it can be triggered by hand on that PR's branch
    # without waiting for a merge to find out whether it actually compiles.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read and verify app version
        # Directory.Build.props and MediaSuite.iss each carry their own copy of the
        # version, with no automated link between them -- both files' own comments
        # already say so. This step is that link: it reads Directory.Build.props as
        # the source of truth, fails loudly if MediaSuite.iss's MyAppVersion has
        # drifted from it, and publishes the result as this job's own output so the
        # release job below tags the release with the real version instead of a
        # hardcoded one that would silently go stale the moment either file is bumped
        # without the other -- previously that hardcoded tag meant every future
        # release, even a real 1.1.0, would keep overwriting the "MediaSuite v1.0.0"
        # release in place under the wrong version forever, since re-running the
        # publish step on an existing tag updates it rather than erroring.
        id: version
        run: |
          $xml = [xml](Get-Content mediasuite\Directory.Build.props)
          $propsVersion = $xml.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($propsVersion)) {
            throw "Could not read <Version> from mediasuite/Directory.Build.props"
          }

          $issContent = Get-Content mediasuite\installer\MediaSuite.iss -Raw
          $issMatch = [regex]::Match($issContent, '#define MyAppVersion "([^"]+)"')
          if (-not $issMatch.Success) {
            throw "Could not read MyAppVersion from mediasuite/installer/MediaSuite.iss"
          }
          $issVersion = $issMatch.Groups[1].Value

          if ($propsVersion -ne $issVersion) {
            throw "Version mismatch: Directory.Build.props has '$propsVersion' but MediaSuite.iss's MyAppVersion has '$issVersion' -- bump both together."
          }

          Write-Host "App version: $propsVersion"
          echo "version=$propsVersion" >> $env:GITHUB_OUTPUT

      - name: Publish MediaSuite.App (self-contained win-x64)
        run: |
          dotnet publish mediasuite/src/MediaSuite.App/MediaSuite.App.csproj -c Release -r win-x64 --self-contained true -o mediasuite/publish/MediaSuite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up MSVC dev environment
        # No official prebuilt Windows binary exists for LibRaw's dcraw_emu — this puts
        # cl.exe on PATH so fetch-tools.ps1 can compile it from source instead of leaving
        # RAW support unbundled. Every other tool below is a plain download; this one is
        # the exception, and stays isolated to a single "if cl.exe is missing, skip it and
        # keep going" section so it can never take the rest of the fetch down with it.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch bundled tools
        # Downloads real Windows binaries for the tools MediaSuite shells out to, so the
        # installer ships self-contained instead of asking the user to find them. See
        # installer/fetch-tools.ps1 for exactly what is (and, for now, is not) covered.
        # timeout-minutes here, not just the job's own default 6-hour ceiling: a genuine
        # hang inside a fail-soft try/catch section (a network call with no response,
        # not a real failure) would otherwise sit silently burning billed minutes for
        # hours with no visible error at all, discovered only by a human noticing much
        # later — this bounds that to a clear, loud step timeout instead. 45 minutes is
        # generous against the slowest single addition so far (the Face Enhance compile's
        # from-scratch opencv4 + ncnn vcpkg build), while still being a real ceiling.
        timeout-minutes: 45
        run: |
          & mediasuite\installer\fetch-tools.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile installer
        # A native exe's own exit code does not fail a pwsh run: step on its own —
        # GitHub Actions only fails the step on a PowerShell-level terminating error,
        # so this is checked explicitly rather than trusted to propagate.
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" mediasuite\installer\MediaSuite.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaSuite-installer
          path: mediasuite/dist/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: installer
    # Only ever from a real push to main, never a pull request build — a PR from this
    # workflow's own branch must not publish a release before the change is even merged.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: MediaSuite-installer
          path: dist

      - name: Publish GitHub release
        # Without this, "Build installer" only leaves the exe as a 90-day CI artifact
        # that needs a GitHub login to even find — not the "ready to go" download page
        # the README and the in-app update checker both already promise. Re-running this
        # on the same tag updates that release in place rather than erroring.
        # The tag comes from the installer job's own "Read and verify app version" step
        # (Directory.Build.props, cross-checked against MediaSuite.iss) rather than a
        # literal here, so a version bump can never leave this job silently publishing
        # under a stale tag.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.installer.outputs.version }}
          name: MediaSuite v${{ needs.installer.outputs.version }}
          files: dist/*.exe
