name: Kvwin (replay of the Windows app job)

# GENERATED by kvwin.sh for a throwaway ref - never commit this file to a real branch.
# The job below is the `windows` job ("Windows (build, installer .exe)") of .github/workflows/dino8-app.yml of the commit
# under test, copied line for line (runner image, every step and its order, shells, timeouts). Left out, and nothing else:
# the two production signing steps (they need repository secrets), the two artifact uploads (nothing is published), and
# the job-level signing-method expression, which becomes the constant 'none' the real job computes without secrets.
# kvwin_gen.py verifies all of that before anything is pushed (with the optional `keepgoing` the Build command only gets
# ` -- -k 0` appended, so that one run reports every failing compile; a clean build is unaffected). It starts only for a push to kvlite/win-** and uses no secrets.

on:
  push:
    branches: ['kvlite/win-**']

env:
  BUILD_TYPE: Release
permissions:
  contents: read

jobs:
  windows:
    name: Windows (build, installer .exe)
    runs-on: windows-latest
    env:
      # replay: a throwaway ref has no repository secrets; the real job computes 'none' in that case
      WINDOWS_SIGN_METHOD: none
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure (Ninja + MSVC)
        run: cmake -S dino8-app -B dino8-app/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build dino8-app/build --parallel -- -k 0
      - name: Unit tests
        run: cd dino8-app/build && ctest --output-on-failure -C Release
      - name: Version check
        run: dino8-app\build\Dino8.exe --version
      # GitHub's windows-latest runner has no real GPU: WGL reports "The
      # driver does not appear to support OpenGL" and GLFW can't create even
      # a hidden 3.3 core window (confirmed by actually running the smoke
      # test without this step first). Drop in Mesa's llvmpipe software
      # OpenGL implementation as opengl32.dll right next to Dino8.exe -
      # Windows' DLL search order checks the executable's own directory
      # before System32, so this shadows the real (non-functional) driver
      # for this one binary only, with no system-wide install. Queried
      # dynamically (not a pinned version) since this workflow step runs on
      # the Actions runner itself, which has full internet access unlike
      # this repo's own sandboxed dev environment.
      - name: Install Mesa (software OpenGL) for the headless smoke test
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Authenticated: the anonymous api.github.com quota is shared by
          # Pinned to 26.2.5: 26.2.6 (released 2026-11) ships a WGL driver that
          # cannot create a GL 3.3 window on the runner ("WGL: The driver does
          # not appear to support OpenGL"); 26.2.5 passed every earlier run.
          # Unpinned "latest" made the build depend on upstream timing.
          # every runner behind the same egress IP and has already failed a
          # build outright ("API rate limit exceeded for 172.185.150.240",
          # run 531). GITHUB_TOKEN is per-job and gets the authenticated quota.
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/pal1000/mesa-dist-win/releases/tags/26.2.5" -Headers @{ "User-Agent" = "dino8-ci"; "Authorization" = "Bearer $env:GITHUB_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -match "release-msvc\.7z$" } | Select-Object -First 1
          if (-not $asset) { throw "mesa-dist-win: no release-msvc .7z asset found in latest release $($release.tag_name)" }
          Write-Host "Using $($asset.name) from mesa-dist-win $($release.tag_name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\mesa.7z"
          7z x "$env:RUNNER_TEMP\mesa.7z" -o"$env:RUNNER_TEMP\mesa" -y | Out-Null
          $x64 = Get-ChildItem -Path "$env:RUNNER_TEMP\mesa" -Recurse -Directory -Filter "x64" | Select-Object -First 1
          if (-not $x64) { throw "mesa-dist-win archive had no x64 directory" }
          Copy-Item "$($x64.FullName)\*.dll" -Destination "dino8-app\build" -Force
          "MESA_GL_VERSION_OVERRIDE=3.3" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MESA_GLSL_VERSION_OVERRIDE=330" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GALLIUM_DRIVER=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # Historical note (kept because the Defender step below still runs):
      # smoke.sh's DWG reopen used to die on this runner with exit 127 and
      # zero output. Excluding the build/temp dirs from Windows Defender was
      # tried as a fix and did NOT change anything; the real cause was found
      # later by local MinGW+Wine reproduction and fixed at the source: a
      # LibreDWG cvt_TIMEBLL fallback left struct tm's tm_mday at 0, which
      # MSVC's CRT parameter validation aborts on (glibc/Darwin tolerate it)
      # - see cmake/patch_libredwg.cmake round 5. The exclusion is retained
      # only as harmless hardening against real-time-scan latency on the
      # freshly written test files.
      - name: Exclude build/temp dirs from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath (Resolve-Path "dino8-app\build").Path
          Add-MpPreference -ExclusionPath $env:TEMP
          Add-MpPreference -ExclusionProcess "Dino8.exe"
      # The same functional QC Linux already runs (~1500 checks over the
      # real app, not just a build check) - smoke.sh's own xvfb-run guard
      # falls through to a direct run whenever xvfb-run isn't on PATH, which
      # is always true here, so no virtual display setup is needed beyond
      # the software-GL swap above.
      # A genuine hang (not a crash, not a script failure - the process just
      # never produces another line of output) has been observed here twice,
      # independently, at the exact same point (right after ScreenCaptureToFile,
      # launching the next --script child process) on the same commit: with no
      # step timeout, GitHub's default 6-hour job timeout is what finally ends
      # it, eating six hours of this shared branch's Windows CI capacity for a
      # run that was never coming back. A full run of this step took 30 to 40
      # minutes on the 11 runs of the pull-request head 53a680b4 and the commits
      # before it, and the suite has since grown by about half (the same step on
      # Linux went from 23 to 34 minutes), so the limit is 90 minutes, the Linux
      # job's own: headroom for the slower runner, not a tight bound - a real
      # hang still fails fast instead of blocking every other agent's Windows CI
      # on this branch for hours. See RHINO8_KILLER_AUDIT.md row L.
      - name: Smoke test (headless)
        shell: bash
        timeout-minutes: 90
        run: dino8-app/tests/smoke.sh dino8-app/build/Dino8.exe
      - name: Install tree
        run: cmake --install dino8-app/build --prefix dino8-app/build/install --component app
      # The installed exe must run on a machine that has nothing but Windows
      # on it: no Visual C++ redistributable (the CRT is linked statically,
      # see CMakeLists.txt), no CI-runner Python (DINO8_ENABLE_PYTHON is OFF
      # on Windows), no sanitizer runtime. Every one of those has shipped
      # broken before: the same exe passed "--version" here (the runner has
      # them all on PATH) and then failed to start on a clean machine with
      # "python314.dll was not found". dumpbin lists the DLLs the loader
      # will demand up front; anything outside the OS-provided set fails
      # the build.
      - name: Dependents check (installed exe imports only OS DLLs)
        shell: pwsh
        run: |
          $out = & dumpbin /NOLOGO /DEPENDENTS dino8-app\build\install\Dino8.exe
          if ($LASTEXITCODE -ne 0) { throw "dumpbin failed ($LASTEXITCODE)" }
          $dlls = $out | Where-Object { $_ -match '^\s+\S+\.dll\s*$' } | ForEach-Object { $_.Trim().ToLowerInvariant() }
          Write-Host "Dino8.exe imports:"; $dlls | ForEach-Object { Write-Host "  $_" }
          # Denylist, not an allowlist: an allowlist has to enumerate every
          # legitimate OS DLL a GUI app can pull in (dwrite, d3d11,
          # windowscodecs, combase, ...) and missed one on its first run
          # (dwrite.dll, from GDI/ImGui text rendering, broke a real
          # Windows-on-ARM build here). What this check actually needs to
          # catch is the two concrete failure modes that shipped broken
          # exes before: a dynamically-linked CRT/C++ runtime (meaning the
          # static-CRT build in CMakeLists.txt regressed) and a bundled
          # interpreter/sanitizer runtime nothing installs
          # (python*.dll from an accidentally-enabled DINO8_ENABLE_PYTHON,
          # clang_rt.*.dll from AddressSanitizer). A denylist for exactly
          # those stays correct without having to predict every OS DLL a
          # future code change might legitimately start importing.
          $denied = '^(python\d.*|vcruntime\d+(_1)?|msvcp\d+|msvcr\d*|concrt\d+|vcomp\d*|mfc\d+u?|clang_rt\..*|ucrtbased)\.dll$'
          $bad = $dlls | Where-Object { $_ -match $denied }
          if ($bad) { throw "Dino8.exe imports a bundled runtime DLL the installer does not ship: $($bad -join ', ')" }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" dino8-app\packaging\windows\Dino8.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # ---------------------------------------------------------------------
      # Authenticode SELF-TEST with a THROWAWAY certificate (no secret needed,
      # runs on every event including pull requests). Purpose: prove the real
      # signing code path (.github/actions/sign-windows -> packaging/windows/
      # sign.ps1) actually executes and that its output is checked, even though
      # no trusted certificate exists. It signs SCRATCH COPIES of Dino8.exe and
      # the installer with a self-signed certificate generated in this job; the
      # files that are uploaded below are never touched, so the published
      # installer is exactly as unsigned as before unless real secrets exist
      # (then the production steps above already ran, unchanged). Nothing it
      # produces is trusted-signed: the certificate is self-signed and not in any
      # trust store. See docs/CODE_SIGNING.md "What CI proves today".
      # ---------------------------------------------------------------------
      - name: Authenticode self-test 1/4 - create throwaway TEST certificate and scratch copies
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\dino8-app\packaging\windows\test-signing.ps1" -Mode prepare -Source 'dino8-app\build\Dino8.exe', 'dino8-app\dist\*.exe'
      - name: Authenticode self-test 2/4 - sign the scratch copies (real sign-windows action, method test-pfx)
        uses: ./.github/actions/sign-windows
        with:
          method: test-pfx
          label: windows-selftest
          files: ${{ runner.temp }}\dino8-signtest\signed\*.exe
          pfx-base64: ${{ env.DINO8_TEST_PFX_BASE64 }}
          pfx-password: ${{ env.DINO8_TEST_PFX_PASSWORD }}
      - name: Authenticode self-test 3/4 - assert signature present, untrusted, tamper-evident (TEST certificate, NOT trusted)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\dino8-app\packaging\windows\test-signing.ps1" -Mode verify
      - name: Authenticode self-test 4/4 - remove the throwaway certificate and scratch copies
        if: ${{ always() }}
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE\dino8-app\packaging\windows\test-signing.ps1" -Mode cleanup
      # The PowerShell verifier must also be able to say "no": modified file,
      # wrong checksum entry, missing checksum, missing signature -> exit 1.
      - name: verify-release.ps1 negative (tamper) test
        shell: pwsh
        run: scripts\test-verify-release.ps1
      - name: Portable zip
        run: cd dino8-app/build && cpack
