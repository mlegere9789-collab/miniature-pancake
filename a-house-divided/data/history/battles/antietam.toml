id = "antietam"
name = "Antietam (Sharpsburg)"
theater = "eastern"
notes = ["Combined casualties given as about 22,700, the bloodiest single day of the war per the source.", "Corps-commander deaths in the campaign: the source text calls Reno the second corps commander killed in the campaign and then places Mansfield's death afterward. Reno was killed at Fox's Gap on 1862-09-14 and Mansfield was shot on 1862-09-17 and died the next day (the source also says three days after Reno), so the ordinal 'second' is inconsistent and should not be relied on.", "Sequence: Cornfield and East Woods (Hooker, then Mansfield's XII Corps); West Woods (Sumner's lead division lost about 2,200 men in 15-20 minutes); Sunken Road (French and Richardson against D.H. Hill); Burnside Bridge taken about 1:00 p.m., with A.P. Hill's arrival from Harpers Ferry about 3:30-4:00 p.m. driving IX Corps back.", "McClellan kept Porter's V Corps and Franklin's VI Corps largely uncommitted and did not attack on 1862-09-18; the source records that he believed Lee had up to 100,000 men.", "Shepherdstown action on 1862-09-19/20: A.P. Hill's counterattack drove back Porter's detachment, with the 118th Pennsylvania losing about 270 men."]

