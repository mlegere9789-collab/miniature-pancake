id = "gettysburg"
name = "Gettysburg"
theater = "eastern"
notes = ["Day 1 (1863-07-01): Heth's division met Buford's dismounted cavalry on McPherson Ridge; Reynolds was killed in the late morning and Doubleday took over I Corps; Davis's brigade was trapped in the railroad cut; Rodes and Early struck from the north after about 2 p.m. and both Union corps fell back through town, losing about 4,000 prisoners. Hancock took command on Cemetery Hill in the late afternoon. Ewell, ordered to take Cemetery Hill if practicable, did not attack. Casualties for the day per Wikipedia: nearly 9,000 Union, just over 6,000 Confederate.", "Day 2 (1863-07-02): Meade arrived about midnight and held a council that voted to stay. Sickles advanced III Corps to the Peach Orchard salient; Warren spotted the undefended Little Round Top and Vincent's brigade, the 20th Maine and the 140th New York held it against Hood's division; fighting at Devil's Den, the Wheatfield and the Peach Orchard; the 1st Minnesota charge bought time near Plum Run; Ewell's evening attacks on Culp's Hill and East Cemetery Hill failed. Day casualties estimated by Trudeau at about 10,000 Union and 6,800 Confederate, with other estimates higher.", "Day 3 (1863-07-03): Union XII Corps retook the lost trenches on Culp's Hill and the Confederates withdrew by about 11 a.m.; at East Cavalry Field Gregg's division and Custer's brigade stopped Stuart (Union 254 and Confederate 181 casualties); after a cannonade of 150-170 guns beginning about 1 p.m., Pickett's Charge advanced with about 12,500 men and was beaten off in roughly 20-30 minutes. Wikipedia gives Confederate losses for the charge as 6,555 and Union losses as about 1,500; the source notes the Confederate count is unsettled.", "Pickett's step-off time is given as roughly 2-3 p.m. and the source says sources differ; both about 2 p.m. and about 3 p.m. appear in the accounts and neither is established.", "Stuart reached the field only on the afternoon of 1863-07-02; the Stonewall Brigade took part in the Culp's Hill attacks on 1863-07-03.", "Retreat 1863-07-04 to 1863-07-14: Imboden's wagon train of wounded left first; Lee's army crossed the Potomac on the night of 1863-07-13/14, and Pettigrew was mortally wounded at Falling Waters on 1863-07-14."]

