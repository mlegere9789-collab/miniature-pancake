id = "shiloh"
name = "Shiloh (Pittsburg Landing)"
theater = "western"
notes = ["Day 1: Confederates struck the unentrenched Union camps at dawn; the Hornet's Nest was held from about 9 a.m. until Prentiss surrendered about 2,200 men near 5:30 p.m. after a grand battery assembled by Ruggles; W.H.L. Wallace was mortally wounded.", "Johnston was the highest-ranking officer on either side killed in the war; Beauregard called off the attack near dusk, a decision still debated.", "Union last line near the landing included about 50 or more guns and gunboats; Lew Wallace's division reached the right flank about 7 p.m. and Buell's divisions crossed during the night.", "Day 2: about 25,000 fresh Union troops attacked at dawn; Beauregard ordered a retreat around 2:30-3:00 p.m.; Forrest repulsed Sherman at Fallen Timbers on 1862-04-08.", "Combined casualties are given as about 23,700."]

