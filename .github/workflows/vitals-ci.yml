name: Vitals CI

on:
  push:
    branches: [main]
    paths:
      - 'vitals/**'
      - '.github/workflows/vitals-ci.yml'
  pull_request:
    paths:
      - 'vitals/**'
      - '.github/workflows/vitals-ci.yml'
  workflow_dispatch:

jobs:
  backend:
    name: Backend typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vitals/backend

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vitals/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  mobile:
    name: Mobile typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vitals/mobile

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vitals/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
