name: App triage

# Verification capacity for unmerged work: a push to a `kverify/**` branch builds the
# kernel test binary once, then runs the whole kernel suite in parallel shards
# (DINO8_TEST_SHARD=k/N, each shard in its own scratch directory) and reports the
# exact ok / FAILED line counts per shard. It never publishes anything and does not
# run on the main or claude/* branches.

on:
  push:
    branches: ['kverify/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  app-build:
    name: Build Dino8 (app)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo grep -rl "dl.google.com/linux/chrome" /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libgl1-mesa-dev libglu1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev xvfb mesa-utils
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: kverify-app-ccache-${{ github.sha }}
          restore-keys: kverify-app-ccache-
      - name: Configure
        run: cmake -S dino8-app -B dino8-app/build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build dino8-app/build   # all targets: smoke.sh sections use helper binaries (text3dm, hatch3dm, mesh_fixture_gen, ...)
      - name: Plan the section groups
        run: |
          python3 - <<'PY'
          import subprocess, re, json
          out = subprocess.run(['bash', 'dino8-app/tests/run_sections.sh', '-l'], capture_output=True, text=True).stdout
          items = []
          for line in out.splitlines():
              m = re.match(r'\s+(\S+)\s+(\d+)\s+(\d+)\s*$', line)
              if m: items.append((m.group(1), int(m.group(3)) - int(m.group(2)) + 1))
              else:
                  m = re.match(r'\s+(\S+)\s*(.*)$', line)
          items.sort(key=lambda t: -t[1])
          G = 12
          groups = [[] for _ in range(G)]; load = [0] * G
          for n, w in items:
              k = load.index(min(load)); groups[k].append(n); load[k] += w
          json.dump(groups, open('section_groups.json', 'w'))
          print({i: (load[i], groups[i]) for i in range(G)})
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: app-binary
          path: |
            dino8-app/build/
            !dino8-app/build/**/*.o
            !dino8-app/build/**/*.a
            !dino8-app/build/CMakeFiles/**
            !dino8-app/build/_deps/**
            section_groups.json
          retention-days: 3

  app-sections:
    name: Section ${{ matrix.s }}
    needs: app-build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        s: [RVR, SATF, SABF, B2S]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo grep -rl "dl.google.com/linux/chrome" /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-utils libgl1-mesa-dri libglu1-mesa libxrandr2 libxinerama1 libxcursor1 libxi6 libxkbcommon0
      - uses: actions/download-artifact@v4
        with:
          name: app-binary
          path: appbin
      - name: Run the section
        shell: bash
        timeout-minutes: 120
        run: |
          BIN=$(find appbin -type f -name Dino8 | head -1)
          chmod +x "$BIN"
          find appbin -type f -name '*_gen' -o -type f -name '*_check' | xargs -r chmod +x
          set +e
          bash dino8-app/tests/run_sections.sh -b "$PWD/$BIN" -t 6000 ${{ matrix.s }} > group.log 2>&1
          rc=$?
          set -e
          echo "section ${{ matrix.s }} exit=$rc ok=$(grep -c '^ok' group.log) FAIL=$(grep -c '^FAIL' group.log) lines=$(wc -l < group.log)"
          echo "=== per-prefix counts"
          awk '/^(ok|FAIL) /{ t=$1; k=$2; sub(/[_:].*/,"",k); c[t" "k]++ } END{ for (x in c) print c[x], x }' group.log | sort -k3 || true
          echo "=== FAIL lines"
          grep -E '^FAIL' group.log | cut -c1-260 | head -80 || true
          echo "=== FAIL context"
          grep -E -B3 -A8 '^FAIL' group.log | cut -c1-300 | head -300 || true
          echo "=== DBG lines"
          grep -E 'DBG' group.log | cut -c1-400 | head -200 || true
          echo "=== tail"
          tail -n 60 group.log | cut -c1-240 || true
          exit $rc

  bisect:
    name: Bisect ${{ matrix.c }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        c: [8cc52ce7ff1148a6c01f2c31f730084205b8c133, 91ee56253507dcc4f1839526fa780359d49058bf, 6d522112758821a35b08f938947cb02f7de669bf, e0f9f90bf8a2798bd4c86b8faba4aef3e7091a46, 018b59dc0e2ab58caeb7e74d7db572f6de6cc923, 7fabbfa08fa38b48ec1aa7d27429269549aef07e]
    steps:
      - uses: actions/checkout@v4
        with:
          path: me
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.c }}
          path: src
      - name: Install dependencies
        run: |
          sudo grep -rl "dl.google.com/linux/chrome" /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache libgl1-mesa-dev libglu1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev xvfb mesa-utils libgl1-mesa-dri
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: kverify-bisect-ccache-${{ matrix.c }}
          restore-keys: kverify-app-ccache-
      - name: Build
        run: |
          cmake -S src/dino8-app -B src/dino8-app/build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build src/dino8-app/build --target Dino8
      - name: Run the marked curves2 script
        run: |
          cd src
          timeout 1200 xvfb-run -a -s "-screen 0 1600x900x24" dino8-app/build/Dino8 --smoke 400 --script "$GITHUB_WORKSPACE/me/dino8-app/tests/curves2_marked.txt" > ../c2.out 2>&1 || echo "rc=$?"
          grep -h "expect_objects 0" ../c2.out | sed 's/.*got \([0-9]*\).*/\1/' > ../cnt.txt
          grep "^# MARK" "$GITHUB_WORKSPACE/me/dino8-app/tests/curves2_marked.txt" | cut -c1-70 > ../marks.txt
          echo "MARKCOUNTS ${{ matrix.c }}"
          paste -d'|' ../cnt.txt ../marks.txt | awk -F'|' '{printf "MC %s %s\n",$1,$2}'
          grep -h "expect_objects 209\|smoke:" ../c2.out | tail -3
