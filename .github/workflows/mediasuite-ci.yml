name: MediaSuite CI

# WPF only builds on Windows, so this is the real compile check for the app —
# the whole solution, plus the Core test suite.
on:
  push:
    branches: [main]
    paths:
      - 'mediasuite/**'
      - '.github/workflows/mediasuite-ci.yml'
  pull_request:
    paths:
      - 'mediasuite/**'
      - '.github/workflows/mediasuite-ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore mediasuite/MediaSuite.sln

      - name: Build
        run: dotnet build mediasuite/MediaSuite.sln -c Release --no-restore

      - name: Test
        run: dotnet test mediasuite/MediaSuite.sln -c Release --no-build --verbosity normal

  installer:
    name: Build installer
    runs-on: windows-latest
    needs: build

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish MediaSuite.App (self-contained win-x64)
        run: |
          dotnet publish mediasuite/src/MediaSuite.App/MediaSuite.App.csproj -c Release -r win-x64 --self-contained true -o mediasuite/publish/MediaSuite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up MSVC dev environment
        # No official prebuilt Windows binary exists for LibRaw's dcraw_emu — this puts
        # cl.exe on PATH so fetch-tools.ps1 can compile it from source instead of leaving
        # RAW support unbundled. Every other tool below is a plain download; this one is
        # the exception, and stays isolated to a single "if cl.exe is missing, skip it and
        # keep going" section so it can never take the rest of the fetch down with it.
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Fetch bundled tools
        # Downloads real Windows binaries for the tools MediaSuite shells out to, so the
        # installer ships self-contained instead of asking the user to find them. See
        # installer/fetch-tools.ps1 for exactly what is (and, for now, is not) covered.
        run: |
          & mediasuite\installer\fetch-tools.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile installer
        # A native exe's own exit code does not fail a pwsh run: step on its own —
        # GitHub Actions only fails the step on a PowerShell-level terminating error,
        # so this is checked explicitly rather than trusted to propagate.
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" mediasuite\installer\MediaSuite.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaSuite-installer
          path: mediasuite/dist/*.exe
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: installer
    # Only ever from a real push to main, never a pull request build — a PR from this
    # workflow's own branch must not publish a release before the change is even merged.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: MediaSuite-installer
          path: dist

      - name: Publish GitHub release
        # Without this, "Build installer" only leaves the exe as a 90-day CI artifact
        # that needs a GitHub login to even find — not the "ready to go" download page
        # the README and the in-app update checker both already promise. Re-running this
        # on the same tag updates that release in place rather than erroring.
        # Keep the tag in step with <Version> in ../mediasuite/Directory.Build.props and
        # MyAppVersion in mediasuite/installer/MediaSuite.iss — there is no automated
        # link between the three for a project this size.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: MediaSuite v1.0.0
          files: dist/*.exe
