# cbindgen configuration for the Spike R1 boundary probe.
# Regenerate with scripts/gen_header.sh (use --check in CI to detect drift).
language = "C"
include_guard = "DINO8_PROBE_H"
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "both"
tab_width = 2
line_length = 100
sys_includes = ["stddef.h"]
includes = []
header = """
/*
 * dino8_probe.h: C ABI of the Dino 8 Rust core (Spike R1 probe).
 * GENERATED by cbindgen from dino8-core/ffi-probe/src. Do not edit by hand.
 * Regenerate with dino8-core/ffi-probe/scripts/gen_header.sh.
 */"""

[export]
include = ["D8ObjectId", "D8Error", "D8LogHandle", "D8OpRecord", "D8OpRead", "D8LogInfo"]

[enum]
prefix_with_name = false

[parse]
parse_deps = false
