name: Dino 8 App

on:
  push:
    branches: [main, 'claude/pdf-audit-i2bvwm']
    paths: ['dino8-app/**', 'dino8-kernel/**', '.github/workflows/dino8-app.yml']
  pull_request:
    paths: ['dino8-app/**', 'dino8-kernel/**', '.github/workflows/dino8-app.yml']
  workflow_dispatch:

env:
  BUILD_TYPE: Release

permissions:
  contents: write

jobs:
  linux:
    name: Linux (build, smoke test, .deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          # The runner image preinstalls a Google Chrome apt source we never use
          # (nothing below comes from it); its mirror has been repeatedly failing
          # "Hash Sum mismatch" on `apt-get update`, which aborts the whole step -
          # drop it first so a third-party repo we don't need can't break a build
          # that has nothing to do with it. The exact filename varies by runner
          # image, so find it by content instead of guessing a path.
          sudo grep -rl "dl.google.com/linux/chrome" /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libglu1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev xvfb mesa-utils
      - name: Configure
        run: cmake -S dino8-app -B dino8-app/build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE
      - name: Build
        run: cmake --build dino8-app/build
      - name: Unit tests
        run: cd dino8-app/build && ctest --output-on-failure
      - name: Smoke test (headless)
        run: dino8-app/tests/smoke.sh dino8-app/build/Dino8
      - name: Package
        run: cd dino8-app/build && cpack
      - uses: actions/upload-artifact@v4
        with:
          name: Dino8-linux
          path: |
            dino8-app/build/*.deb
            dino8-app/build/*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (build, installer .exe)
    runs-on: windows-latest
    env:
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure (Ninja + MSVC)
        run: cmake -S dino8-app -B dino8-app/build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build dino8-app/build --parallel
      - name: Unit tests
        run: cd dino8-app/build && ctest --output-on-failure -C Release
      - name: Version check
        run: dino8-app\build\Dino8.exe --version
      # GitHub's windows-latest runner has no real GPU: WGL reports "The
      # driver does not appear to support OpenGL" and GLFW can't create even
      # a hidden 3.3 core window (confirmed by actually running the smoke
      # test without this step first). Drop in Mesa's llvmpipe software
      # OpenGL implementation as opengl32.dll right next to Dino8.exe -
      # Windows' DLL search order checks the executable's own directory
      # before System32, so this shadows the real (non-functional) driver
      # for this one binary only, with no system-wide install. Queried
      # dynamically (not a pinned version) since this workflow step runs on
      # the Actions runner itself, which has full internet access unlike
      # this repo's own sandboxed dev environment.
      - name: Install Mesa (software OpenGL) for the headless smoke test
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest" -Headers @{ "User-Agent" = "dino8-ci" }
          $asset = $release.assets | Where-Object { $_.name -match "release-msvc\.7z$" } | Select-Object -First 1
          if (-not $asset) { throw "mesa-dist-win: no release-msvc .7z asset found in latest release $($release.tag_name)" }
          Write-Host "Using $($asset.name) from mesa-dist-win $($release.tag_name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:RUNNER_TEMP\mesa.7z"
          7z x "$env:RUNNER_TEMP\mesa.7z" -o"$env:RUNNER_TEMP\mesa" -y | Out-Null
          $x64 = Get-ChildItem -Path "$env:RUNNER_TEMP\mesa" -Recurse -Directory -Filter "x64" | Select-Object -First 1
          if (-not $x64) { throw "mesa-dist-win archive had no x64 directory" }
          Copy-Item "$($x64.FullName)\*.dll" -Destination "dino8-app\build" -Force
          "MESA_GL_VERSION_OVERRIDE=3.3" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MESA_GLSL_VERSION_OVERRIDE=330" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GALLIUM_DRIVER=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # smoke.sh's DWG round-trip test fails deterministically on this runner
      # with exit 127 and zero output - not even the script's first command
      # ever gets printed, on a binary that has already launched and run
      # successfully dozens of times earlier in this same job. A same-job
      # "run the exact same DWG script very early too" diagnostic proved
      # this isn't positional/cumulative (fails just as hard as the 2nd
      # process launch) - it's tied to the DWG code path's content. Tried
      # excluding the build/temp dirs from Windows Defender (suspecting
      # real-time-scan interference on a freshly-written .dwg/.exe) - ran
      # cleanly but did NOT fix it, ruling that theory out. Kept as a
      # harmless hardening; the real cause is still open.
      - name: Exclude build/temp dirs from Windows Defender
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath (Resolve-Path "dino8-app\build").Path
          Add-MpPreference -ExclusionPath $env:TEMP
          Add-MpPreference -ExclusionProcess "Dino8.exe"
      # Rounds 1-2 of this bisection were both invalid, for the same root
      # cause I should have caught up front: Export is registered as an
      # OnSelection command (cmd_file.cpp) - it needs an active selection
      # or it opens a picker and BLOCKS waiting for one. None of the test
      # scripts called SelAll first, so every "Export" line sat idle
      # consuming the whole frame budget with nothing selected, then the
      # smoke harness exited cleanly (by design) - never actually running
      # an export at all. Fixed and verified locally (Linux) before
      # pushing. Round 3 (with SelAll, --smoke 50) gave the first real signal: "two
      # plain Exports, same process" and "two differently-versioned
      # Exports, same process" both succeeded, but "Export, then New, then
      # Open that same file back, same process" failed instantly with
      # exit=127 and ZERO output - not even the startup banner that prints
      # unconditionally before any script line runs, and not even the
      # Export's own confirmation that should have printed first. Round 4
      # added: Opening a DWG written by a SEPARATE process (dwg_fixture_gen)
      # succeeded cleanly (6 objects) - so DWG import is not broken in
      # general on Windows, only after a same-process Export happens first.
      # This round narrows it further with two more same-process tests
      # (verified locally on Linux, where the crash doesn't reproduce, but
      # confirms both scripts execute the intended commands correctly):
      # Export then Open the SAME path directly (no "New" in between - was
      # New itself ever involved?), and Export one file then Open a
      # DIFFERENT, independently-pre-written fixture file (does ANY import
      # after an in-process Export crash, or specifically reopening the
      # exact same path?). Round 5 result: exactly "reopen the same path"
      # fails (with or without New); everything else succeeds. Applied a
      # fix in FileExchange.cpp (ExportDwg writes to a temp file, then
      # atomically renames it into place, so `path` is never a file this
      # process itself held open for writing) on the theory that a
      # lingering write handle/cache tied to the destination path was the
      # trigger - kept as a real, independently-good crash-safety practice
      # (atomic export), but it did NOT fix this crash: the exact same
      # zero-output exit=127 still happens even via rename-into-place, so
      # the trigger tracks this process touching `path` at all, not
      # specifically an open write handle on it. This round adds one more
      # test to check a timing/caching-staleness angle instead: the same
      # write-then-reopen, but with a 120-frame (--script "wait N", real
      # elapsed time) pause in between - if a delay fixes it, this is a
      # metadata-refresh/caching race, not a permanent same-path block.
      # continue-on-error so this never blocks the actual smoke.sh run
      # below.
      - name: DWG export bisection (diagnostic)
        shell: bash
        continue-on-error: true
        run: |
          set +e
          T="$(cygpath -m "$RUNNER_TEMP")/dwgbisect"
          mkdir -p "$T"
          printf 'Line 0,0,0 12,0,0\nSelAll\nExport %s/two_a.dwg\nSelAll\nExport %s/two_b.dwg\n' "$T" "$T" > "$T/two_exports.txt"
          printf 'Line 0,0,0 12,0,0\nSelAll\nExport %s/exp.dwg\nNew\nOpen %s/exp.dwg\n' "$T" "$T" > "$T/export_open.txt"
          printf 'Line 0,0,0 12,0,0\nSelAll\nExport Version=13 %s/v13.dwg\nSelAll\nExport Version=2018 %s/v2018.dwg\n' "$T" "$T" > "$T/two_versioned.txt"
          dino8-app/build/dwg_fixture_gen.exe "$T/fixture.dwg"
          dino8-app/build/dwg_fixture_gen.exe "$T/fixture2.dwg"
          printf 'Open %s/fixture.dwg\nSelAll\nList\n' "$T" > "$T/open_only.txt"
          printf 'Line 0,0,0 12,0,0\nSelAll\nExport %s/a.dwg\nOpen %s/a.dwg\n' "$T" "$T" > "$T/direct_reopen.txt"
          printf 'Line 0,0,0 12,0,0\nSelAll\nExport %s/b.dwg\nOpen %s/fixture2.dwg\n' "$T" "$T" > "$T/export_then_other.txt"
          printf 'Line 0,0,0 12,0,0\nSelAll\nExport %s/c.dwg\nwait 120\nOpen %s/c.dwg\n' "$T" "$T" > "$T/delay_reopen.txt"
          echo "--- two plain Exports, same process ---"
          dino8-app/build/Dino8.exe --smoke 50 --script "$T/two_exports.txt" 2>&1
          echo "exit=$?"
          echo "--- Export then New+Open, same process ---"
          dino8-app/build/Dino8.exe --smoke 50 --script "$T/export_open.txt" 2>&1
          echo "exit=$?"
          echo "--- two differently-versioned Exports, same process ---"
          dino8-app/build/Dino8.exe --smoke 50 --script "$T/two_versioned.txt" 2>&1
          echo "exit=$?"
          echo "--- Open only, a DWG written by a separate process (dwg_fixture_gen) ---"
          dino8-app/build/Dino8.exe --smoke 50 --script "$T/open_only.txt" 2>&1
          echo "exit=$?"
          echo "--- Export then Open the SAME path directly, no New ---"
          dino8-app/build/Dino8.exe --smoke 50 --script "$T/direct_reopen.txt" 2>&1
          echo "exit=$?"
          echo "--- Export one file, then Open a DIFFERENT pre-existing fixture ---"
          dino8-app/build/Dino8.exe --smoke 50 --script "$T/export_then_other.txt" 2>&1
          echo "exit=$?"
          echo "--- Export then Open the SAME path, with a 120-frame wait between ---"
          dino8-app/build/Dino8.exe --smoke 200 --script "$T/delay_reopen.txt" 2>&1
          echo "exit=$?"
          exit 0
      # The same functional QC Linux already runs (~1500 checks over the
      # real app, not just a build check) - smoke.sh's own xvfb-run guard
      # falls through to a direct run whenever xvfb-run isn't on PATH, which
      # is always true here, so no virtual display setup is needed beyond
      # the software-GL swap above.
      - name: Smoke test (headless)
        shell: bash
        run: dino8-app/tests/smoke.sh dino8-app/build/Dino8.exe
      # Inert until a real certificate exists: skipped entirely (no-op) when
      # the WINDOWS_CERT_BASE64 secret is unset, so this changes nothing
      # about today's unsigned builds. Signing the built exe here (before the
      # install tree, installer, and portable zip are made from it) means all
      # three downstream artifacts carry the signed binary. See
      # dino8-app/docs/CODE_SIGNING.md for exactly what secret to add and
      # where the certificate comes from.
      - name: Sign Dino8.exe (Authenticode)
        if: ${{ env.HAS_WINDOWS_CERT == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $certPath = "$env:RUNNER_TEMP\dino8-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /f $certPath /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dino8-app\build\Dino8.exe
          $code = $LASTEXITCODE
          Remove-Item $certPath
          if ($code -ne 0) { exit $code }
      - name: Install tree
        run: cmake --install dino8-app/build --prefix dino8-app/build/install --component app
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" dino8-app\packaging\windows\Dino8.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Same secret gate as above: signs the installer wrapper itself once
      # ISCC has produced it (the payload it embeds, build\install\Dino8.exe,
      # is already the signed binary from the step above).
      - name: Sign Windows installer (Authenticode)
        if: ${{ env.HAS_WINDOWS_CERT == 'true' }}
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $certPath = "$env:RUNNER_TEMP\dino8-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /f $certPath /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dino8-app\dist\*.exe
          $code = $LASTEXITCODE
          Remove-Item $certPath
          if ($code -ne 0) { exit $code }
      - name: Portable zip
        run: cd dino8-app/build && cpack
      - uses: actions/upload-artifact@v4
        with:
          name: Dino8-windows-installer
          path: dino8-app/dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Dino8-windows-portable
          path: dino8-app/build/*.zip
          if-no-files-found: error

  windows-arm:
    name: Windows on ARM (build, portable zip)
    runs-on: windows-11-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Configure (Ninja + MSVC arm64)
        run: cmake -S dino8-app -B dino8-app/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DCPACK_SYSTEM_NAME=win-arm64
      - name: Build
        run: cmake --build dino8-app/build --parallel
      - name: Version check
        run: dino8-app\build\Dino8.exe --version
      - name: Portable zip
        run: cd dino8-app/build && cpack
      - uses: actions/upload-artifact@v4
        with:
          name: Dino8-windows-arm64
          path: dino8-app/build/*.zip
          if-no-files-found: error
  macos:
    name: macOS (build, .dmg)
    runs-on: macos-14
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake -S dino8-app -B dino8-app/build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
      - name: Build
        run: cmake --build dino8-app/build
      # NOT run here (Linux and Windows both run the same tests/smoke.sh
      # QC suite): GitHub's macos-14 Actions runner cannot create a native
      # GLFW/OpenGL window at all - "GLFW error 65545: NSGL: Failed to
      # find a suitable pixel format" persists even for the simplest
      # possible 3.3 core request (0 samples, no other hints), confirmed
      # by two separate attempts (one dropping 4x MSAA first, suspecting
      # that was the cause; it was not). This is a documented, systemic
      # limitation of GitHub's hosted macOS runners' virtualized/no-GPU
      # environment for any app requesting a native NSGL context - not
      # something fixable by more Dino 8 code, unlike Windows (which has
      # no GPU either, but a real fix exists: Mesa's llvmpipe software
      # OpenGL can fully replace opengl32.dll since Windows' WGL/GDI model
      # allows a drop-in software implementation; macOS's NSGL model
      # brokers pixel formats through the OS/WindowServer itself with no
      # equivalent drop-in swap available). ctest's own kernel/geometry
      # unit tests above still give real coverage on this platform.
      - name: Unit tests
        run: cd dino8-app/build && ctest --output-on-failure
      # Inert until a real certificate exists: both steps below are skipped
      # entirely (no-op) when the APPLE_CERT_BASE64 secret is unset, so this
      # changes nothing about today's unsigned/unnotarized .dmg. See
      # dino8-app/docs/CODE_SIGNING.md for exactly what secrets to add and
      # where the Developer ID certificate and app-specific password come
      # from.
      - name: Import Developer ID certificate
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dino8-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/dino8-signing.keychain-db"
          echo -n "$APPLE_CERT_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
      - name: Code-sign the app bundle
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" dino8-app/build/Dino8.app
          codesign --verify --deep --strict --verbose=2 dino8-app/build/Dino8.app
      - name: Package
        run: cd dino8-app/build && cpack
      # Same secret gate: notarizes and staples the .dmg cpack just produced,
      # skipped entirely when there is no certificate to sign it with (Apple
      # refuses to notarize an unsigned bundle).
      - name: Notarize and staple the disk image
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          DMG="$(ls dino8-app/build/*.dmg | head -1)"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: Dino8-macos
          path: dino8-app/build/*.dmg
          if-no-files-found: error

  release:
    name: Publish beta pre-release
    # Every push to the development branch (or a manual run) that builds on
    # all three platforms publishes a downloadable pre-release with the
    # installers attached. Free software: no licence keys involved.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [linux, windows, windows-arm, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: List files
        run: find dist -type f | sort
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: dino8-beta-${{ github.run_number }}
          name: "Dino 8 beta build ${{ github.run_number }}"
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Dino 8 beta test build from commit ${{ github.sha }}.

            * **Windows**: `Dino8Setup-0.1.0.exe` (installer) or the portable `Dino8-0.1.0-win64.zip`
            * **Windows on ARM**: portable `Dino8-0.1.0-win-arm64.zip` (when the ARM runner is available)
            * **Linux**: `dino8_0.1.0_amd64.deb` or `Dino8-0.1.0-Linux.tar.gz`
            * **macOS** (Apple Silicon): `Dino8-0.1.0-Darwin.dmg`

            Totally free. No subscription, no payment, no licence keys, no accounts.
          files: |
            dist/Dino8-windows-installer/*.exe
            dist/Dino8-windows-portable/*.zip
            dist/Dino8-windows-arm64/*.zip
            dist/Dino8-linux/*.deb
            dist/Dino8-linux/*.tar.gz
            dist/Dino8-macos/*.dmg
