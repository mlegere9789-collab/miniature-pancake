id = "fredericksburg"
name = "Fredericksburg"
theater = "eastern"
notes = ["Burnside's plan to cross before Lee concentrated failed when pontoon bridges arrived about two weeks late; Longstreet and then Jackson occupied the heights.", "Crossing on 1862-12-11 was delayed about twelve hours by Barksdale's Mississippi sharpshooters until volunteers crossed in boats at dusk; the town was then fought through house by house.", "South end: Meade's division broke through a gap in A.P. Hill's line, unsupported, and was driven back; Pelham's horse artillery delayed the Union advance for roughly an hour.", "North end: fourteen separate assaults by seven divisions against the Sunken Road; Hancock's division alone lost 2,032 men; Cobb was mortally wounded and replaced by Kershaw.", "Franklin held most of the Left Grand Division (about 55,000) in reserve and committed only about 8,000 to the main assault."]

