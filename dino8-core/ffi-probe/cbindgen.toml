# cbindgen configuration for the Spike R1 boundary probe.
# Regenerate with scripts/gen_header.sh (use --check in CI to detect drift).
language = "C"
include_guard = "DINO8_PROBE_H"
cpp_compat = true
documentation = true
documentation_style = "doxy"
style = "type"
tab_width = 2
line_length = 100
usize_is_size_t = true
header = """
/*
 * dino8_probe.h: C ABI of the Dino 8 Rust core (Spike R1 probe).
 * GENERATED by cbindgen from dino8-core/ffi-probe/src. Do not edit by hand.
 * Regenerate with dino8-core/ffi-probe/scripts/gen_header.sh.
 *
 * Conventions (details in dino8-core/ADR-boundary.md):
 *  - Every function returns a D8Status (0 = success). Pass a D8Error* (or NULL) to receive a
 *    code, a detail value and a message. The caller owns the record; the library only writes it.
 *  - Handles (D8LogHandle) are opaque tokens. A closed or forged handle is rejected with
 *    D8_ERR_BAD_HANDLE; it never causes undefined behavior.
 *  - The library copies what it keeps and frees only what it allocated. The caller frees its own
 *    memory. Nothing allocated by the library is ever handed to the caller to free.
 *  - Pointer arguments must be NULL (only where documented) or valid, correctly aligned, and not
 *    modified by another thread during the call. Buffers are caller memory; sizes are in
 *    elements unless the name says bytes.
 *  - A Rust panic is caught at the boundary and returned as D8_ERR_PANIC. It never unwinds into
 *    the caller. A C++ exception must never propagate into the library: catch it before calling.
 *  - Functions are thread-safe unless documented otherwise.
 */"""
after_includes = """
/* Initializer for a D8Error: D8Error err = D8_ERROR_INIT; */
#define D8_ERROR_INIT { 0 }"""

[export]
include = ["D8ObjectId", "D8Error", "D8LogHandle", "D8OpRecord", "D8OpRead", "D8LogInfo"]

[enum]
prefix_with_name = false

[parse]
parse_deps = false
