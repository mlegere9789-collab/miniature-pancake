id = "first_bull_run"
name = "First Bull Run (First Manassas)"
theater = "eastern"
notes = ["Union plan: demonstration at the fords while the main body made a long flank march to Sudley Ford; the march ran about three hours behind schedule and Tyler's division blocked the turnpike.", "Confederate reinforcement by rail: Johnston's army left Winchester on 1861-07-18 and about 9,000 of his men reached Manassas by 1861-07-21, a notable early use of railroads for concentration; Patterson's cautious stance in the Valley allowed this.", "Evans moved on his own authority to Matthews Hill after E.P. Alexander's signal warning; Jackson's brigade stood on Henry House Hill, the origin of the Stonewall nickname (Bee's remark is recorded in conflicting forms).", "Turning points listed: the Union pause after Matthews Hill, Jackson's reverse-slope defense, capture of Ricketts's and Griffin's guns, arrival of Early and Kirby Smith near 4 p.m., panic at the Cub Run bridge.", "Blackburn's Ford (1861-07-18) was a Union reconnaissance repulsed by Longstreet's brigade with light losses, which pushed McDowell toward a turning movement."]

