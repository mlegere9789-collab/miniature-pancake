name: A House Divided CI

on:
  push:
    branches: [main]
    paths: ['a-house-divided/**', '.github/workflows/house-divided-ci.yml']
  pull_request:
    paths: ['a-house-divided/**', '.github/workflows/house-divided-ci.yml']

defaults:
  run:
    shell: bash
    working-directory: a-house-divided

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  gates:
    name: gates (scan, lint, data)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - name: forbidden terms (G4)
        run: python3 tools/scan_forbidden.py
      - name: no process text
        run: python3 tools/lint_process_text.py
      - name: historical data validation
        run: python3 tools/validate_data.py

  rust:
    name: rust (fmt, clippy, tests)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup toolchain install 1.97.0 --profile minimal -c rustfmt -c clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            a-house-divided/target
          key: hd-${{ runner.os }}-${{ hashFiles('a-house-divided/Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --release

  determinism:
    name: determinism (${{ matrix.os }})
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - run: cargo test --workspace --locked --release
      - name: verify golden replays (cross-platform proof)
        run: bash tools/verify_goldens.sh
